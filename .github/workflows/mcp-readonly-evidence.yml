name: MCP Read-only Evidence

on:
  issues:
    types:
      - opened
  workflow_dispatch:
    inputs:
      target:
        description: Read-only server target
        required: true
        type: choice
        options:
          - s1
          - s2
      probe:
        description: Allowlisted read-only probe
        required: true
        type: choice
        options:
          - mcp_git_status
          - stablecoin_frontend_git_status
          - stablecoin_backend_git_status
          - stablecoin_runtime_status
          - server_disk
          - docker_status
      request_id:
        description: Bounded correlation id
        required: true
        type: string

permissions:
  contents: read

jobs:
  authorize:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'MCP_READONLY_EVIDENCE_REQUEST'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      target: ${{ steps.request.outputs.target }}
      probe: ${{ steps.request.outputs.probe }}
      request_id: ${{ steps.request.outputs.request_id }}
      fallback_environment_name: ${{ steps.request.outputs.fallback_environment_name }}
      issue_number: ${{ steps.request.outputs.issue_number }}
    steps:
      - name: Authorize GitHub actor
        if: github.event_name == 'issues'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 10 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/collaborators/${REQUEST_ACTOR}/permission")"
          permission="$(printf '%s' "$response" | node -e "const fs=require('fs'); const raw=fs.readFileSync(0,'utf8'); if (Buffer.byteLength(raw)>32768) process.exit(2); const body=JSON.parse(raw); process.stdout.write(String(body.permission||''));")"
          case "$permission" in
            admin|maintain|write) ;;
            *)
              printf 'GitHub actor is not authorized for read-only server evidence.\n' >&2
              exit 13
              ;;
          esac

      - name: Validate bounded evidence request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DISPATCH_TARGET: ${{ inputs.target }}
          DISPATCH_PROBE: ${{ inputs.probe }}
          DISPATCH_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const eventName = process.env.EVENT_NAME;
          let request;
          if (eventName === 'workflow_dispatch') {
            request = {
              schemaVersion: 1,
              target: process.env.DISPATCH_TARGET,
              probe: process.env.DISPATCH_PROBE,
              requestId: process.env.DISPATCH_REQUEST_ID
            };
          } else {
            const raw = process.env.ISSUE_BODY || '';
            if (Buffer.byteLength(raw, 'utf8') > 4096) process.exit(20);
            try { request = JSON.parse(raw); } catch { process.exit(21); }
          }

          const keys = Object.keys(request || {}).sort();
          if (JSON.stringify(keys) !== JSON.stringify(['probe','requestId','schemaVersion','target'])) process.exit(22);
          if (request.schemaVersion !== 1) process.exit(23);
          if (!['s1','s2'].includes(request.target)) process.exit(24);
          if (!['mcp_git_status','stablecoin_frontend_git_status','stablecoin_backend_git_status','stablecoin_runtime_status','server_disk','docker_status'].includes(request.probe)) process.exit(25);
          if (!/^[A-Za-z0-9._-]{8,80}$/.test(request.requestId || '')) process.exit(26);
          if (request.probe === 'mcp_git_status' && request.target !== 's1') process.exit(27);
          if (['stablecoin_frontend_git_status','stablecoin_backend_git_status','stablecoin_runtime_status'].includes(request.probe) && request.target !== 's2') process.exit(28);

          process.stdout.write('target=' + request.target + '\n');
          process.stdout.write('probe=' + request.probe + '\n');
          process.stdout.write('request_id=' + request.requestId + '\n');
          process.stdout.write('fallback_environment_name=mcp-' + request.target + '-readonly\n');
          process.stdout.write('issue_number=' + (process.env.ISSUE_NUMBER || '') + '\n');
          NODE

  collect_oidc:
    needs:
      - authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Collect through GitHub OIDC read-only endpoint
        id: collect
        shell: bash
        env:
          TARGET: ${{ needs.authorize.outputs.target }}
          PROBE: ${{ needs.authorize.outputs.probe }}
          REQUEST_ID: ${{ needs.authorize.outputs.request_id }}
          MCP_BASE_URL: https://mcp.wealthtechinnovations.com
          MCP_OIDC_AUDIENCE: https://mcp.wealthtechinnovations.com/evidence/github/readonly
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/mcp-readonly-evidence"
          mkdir -p "$evidence_dir"

          get_oidc() {
            if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
              printf '%s\n' 'GitHub OIDC request context unavailable.' >&2
              return 1
            fi
            local separator='?'
            case "$ACTIONS_ID_TOKEN_REQUEST_URL" in
              *\?*) separator='&' ;;
            esac
            local encoded_audience
            encoded_audience="$(node -e "process.stdout.write(encodeURIComponent(process.env.MCP_OIDC_AUDIENCE || ''))")"
            local response
            response="$(curl --fail --silent --show-error --max-time 10 \
              --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=${encoded_audience}")"
            printf '%s' "$response" | node -e "const fs=require('fs'); const raw=fs.readFileSync(0,'utf8'); if (Buffer.byteLength(raw,'utf8') > 32768) process.exit(1); const body=JSON.parse(raw); if (!body || typeof body.value !== 'string' || body.value.length < 32 || body.value.length > 16384) process.exit(1); process.stdout.write(body.value);"
          }

          REQUEST_BODY="$(GITHUB_SHA="$GITHUB_SHA" TARGET="$TARGET" PROBE="$PROBE" REQUEST_ID="$REQUEST_ID" node -e "const sha=process.env.GITHUB_SHA; const target=process.env.TARGET; const probe=process.env.PROBE; const requestId=process.env.REQUEST_ID; if (!/^[0-9a-f]{40}$/.test(sha)) process.exit(1); process.stdout.write(JSON.stringify({sha,target,probe,requestId}));")"
          OIDC_TOKEN="$(get_oidc)"
          printf '::add-mask::%s\n' "$OIDC_TOKEN"

          RESPONSE="$(curl --fail --silent --show-error --max-time 20 \
            --request POST \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "$REQUEST_BODY" \
            "${MCP_BASE_URL}/evidence/github/readonly")"
          unset OIDC_TOKEN REQUEST_BODY

          RESPONSE="$RESPONSE" TARGET="$TARGET" PROBE="$PROBE" REQUEST_ID="$REQUEST_ID" \
          RUN_ID="$GITHUB_RUN_ID" REPOSITORY="$GITHUB_REPOSITORY" SHA="$GITHUB_SHA" \
          EVIDENCE_DIR="$evidence_dir" node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const raw = process.env.RESPONSE || '';
          if (Buffer.byteLength(raw, 'utf8') > 65536) process.exit(41);
          let body;
          try { body = JSON.parse(raw); } catch { process.exit(42); }
          if (!body || body.schemaVersion !== 1) process.exit(43);
          if (body.requestId !== process.env.REQUEST_ID) process.exit(44);
          if (body.target !== process.env.TARGET || body.probe !== process.env.PROBE) process.exit(45);
          if (body.sha !== process.env.SHA || body.mutationAllowed !== false) process.exit(46);
          if (typeof body.output !== 'string' || Buffer.byteLength(body.output, 'utf8') > 32768) process.exit(47);

          const dir = process.env.EVIDENCE_DIR;
          fs.writeFileSync(dir + '/output.txt', body.output, { mode: 0o600 });
          fs.writeFileSync(dir + '/metadata.json', JSON.stringify({
            schemaVersion: 1,
            policy: 'github-oidc-readonly-evidence-v1',
            transport: 'github_oidc_mcp_readonly',
            requestId: process.env.REQUEST_ID,
            target: process.env.TARGET,
            probe: process.env.PROBE,
            repository: process.env.REPOSITORY,
            workflowSha: process.env.SHA,
            workflowRunId: Number(process.env.RUN_ID),
            observedAt: new Date().toISOString(),
            outputSha256: crypto.createHash('sha256').update(body.output, 'utf8').digest('hex'),
            mutationAllowed: false
          }, null, 2) + '\n', { mode: 0o600 });
          NODE

          printf 'artifact_name=mcp-readonly-evidence-%s\n' "$REQUEST_ID" >> "$GITHUB_OUTPUT"

      - name: Upload OIDC read-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.artifact_name }}
          path: ${{ runner.temp }}/mcp-readonly-evidence
          if-no-files-found: error
          retention-days: 1

      - name: Report OIDC evidence handle to GitHub issue
        if: github.event_name == 'issues'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.authorize.outputs.issue_number }}
          REQUEST_ID: ${{ needs.authorize.outputs.request_id }}
          TARGET: ${{ needs.authorize.outputs.target }}
          PROBE: ${{ needs.authorize.outputs.probe }}
          ARTIFACT_NAME: ${{ steps.collect.outputs.artifact_name }}
        run: |
          set -euo pipefail
          body="$(node -e "process.stdout.write(JSON.stringify({body:[
            'MCP_READONLY_EVIDENCE_RESULT',
            'requestId=' + process.env.REQUEST_ID,
            'target=' + process.env.TARGET,
            'probe=' + process.env.PROBE,
            'runId=' + process.env.GITHUB_RUN_ID,
            'artifact=' + process.env.ARTIFACT_NAME,
            'transport=github_oidc_mcp_readonly',
            'status=SUCCESS',
            'mutationAllowed=false'
          ].join('\\n')}))")"
          curl --fail --silent --show-error --max-time 10 \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$body" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            >/dev/null

  collect_ssh_fallback:
    needs:
      - authorize
      - collect_oidc
    if: always() && needs.authorize.result == 'success' && needs.collect_oidc.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ needs.authorize.outputs.fallback_environment_name }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Validate fallback environment secrets
        id: secrets
        shell: bash
        env:
          SSH_HOST: ${{ secrets.MCP_READONLY_SSH_HOST }}
          SSH_PORT: ${{ secrets.MCP_READONLY_SSH_PORT }}
          SSH_USER: ${{ secrets.MCP_READONLY_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.MCP_READONLY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.MCP_READONLY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!name:-}" ]; then
              printf 'Required protected fallback secret is missing: %s\n' "$name" >&2
              exit 31
            fi
          done
          case "$SSH_PORT" in
            ''|*[!0-9]*) exit 32 ;;
          esac

      - name: Collect through direct SSH fallback
        id: collect
        shell: bash
        env:
          TARGET: ${{ needs.authorize.outputs.target }}
          PROBE: ${{ needs.authorize.outputs.probe }}
          REQUEST_ID: ${{ needs.authorize.outputs.request_id }}
          SSH_HOST: ${{ secrets.MCP_READONLY_SSH_HOST }}
          SSH_PORT: ${{ secrets.MCP_READONLY_SSH_PORT }}
          SSH_USER: ${{ secrets.MCP_READONLY_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.MCP_READONLY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.MCP_READONLY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          evidence_dir="$RUNNER_TEMP/mcp-readonly-evidence"
          ssh_dir="$RUNNER_TEMP/mcp-readonly-ssh"
          mkdir -p "$evidence_dir" "$ssh_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"

          case "$PROBE" in
            mcp_git_status)
              remote_command="$(cat <<'REMOTE'
          set -euo pipefail
          cd /opt/apps/wealthtech-mcp-ssh-bridge
          printf 'branch=%s\n' "$(git branch --show-current)"
          printf 'head=%s\n' "$(git rev-parse HEAD)"
          printf 'working_tree_changes=%s\n' "$(git status --porcelain=v1 --untracked-files=all | wc -l | tr -d ' ')"
          origin_url="$(git remote get-url origin 2>/dev/null || true)"
          push_url="$(git remote get-url --push origin 2>/dev/null || true)"
          printf 'origin_fetch=%s\n' "$(printf '%s' "$origin_url" | sed -E 's#(https?://)[^/@[:space:]]+@#\1***@#g')"
          printf 'origin_push=%s\n' "$(printf '%s' "$push_url" | sed -E 's#(https?://)[^/@[:space:]]+@#\1***@#g')"
          REMOTE
          )"
              ;;
            stablecoin_frontend_git_status)
              remote_command="$(cat <<'REMOTE'
          set -euo pipefail
          cd /var/www/vhosts/chainsolutions.fr/stablecoin.chainsolutions.fr/stablecoin
          printf 'branch=%s\n' "$(git branch --show-current)"
          printf 'head=%s\n' "$(git rev-parse HEAD)"
          printf 'working_tree_changes=%s\n' "$(git status --porcelain=v1 --untracked-files=all | wc -l | tr -d ' ')"
          origin_url="$(git remote get-url origin 2>/dev/null || true)"
          push_url="$(git remote get-url --push origin 2>/dev/null || true)"
          printf 'origin_fetch=%s\n' "$(printf '%s' "$origin_url" | sed -E 's#(https?://)[^/@[:space:]]+@#\1***@#g')"
          printf 'origin_push=%s\n' "$(printf '%s' "$push_url" | sed -E 's#(https?://)[^/@[:space:]]+@#\1***@#g')"
          REMOTE
          )"
              ;;
            stablecoin_backend_git_status)
              remote_command="$(cat <<'REMOTE'
          set -u
          path='/var/www/vhosts/chainsolutions.fr/api.stablecoin.chainsolutions.fr'
          printf 'path=%s\n' "$path"
          if [ ! -d "$path" ]; then
            printf 'path_exists=false\n'
            printf 'git_repo=false\n'
            exit 0
          fi
          printf 'path_exists=true\n'
          if ! git -C "$path" rev-parse --git-dir >/dev/null 2>&1; then
            printf 'git_repo=false\n'
            exit 0
          fi
          printf 'git_repo=true\n'
          branch="$(git -C "$path" branch --show-current 2>/dev/null || true)"
          head="$(git -C "$path" rev-parse HEAD 2>/dev/null || true)"
          status_output="$(git -C "$path" status --porcelain=v1 --untracked-files=all 2>/dev/null || true)"
          if [ -n "$status_output" ]; then changes="$(printf '%s\n' "$status_output" | wc -l | tr -d ' ')"; else changes='0'; fi
          origin_url="$(git -C "$path" remote get-url origin 2>/dev/null || true)"
          push_url="$(git -C "$path" remote get-url --push origin 2>/dev/null || true)"
          [ -n "$branch" ] || branch='UNKNOWN'
          [ -n "$head" ] || head='UNKNOWN'
          [ -n "$origin_url" ] || origin_url='UNKNOWN'
          [ -n "$push_url" ] || push_url='UNKNOWN'
          printf 'branch=%s\n' "$branch"
          printf 'head=%s\n' "$head"
          printf 'working_tree_changes=%s\n' "$changes"
          printf 'origin_fetch=%s\n' "$(printf '%s' "$origin_url" | sed -E 's#(https?://)[^/@[:space:]]+@#\1***@#g')"
          printf 'origin_push=%s\n' "$(printf '%s' "$push_url" | sed -E 's#(https?://)[^/@[:space:]]+@#\1***@#g')"
          exit 0
          REMOTE
          )"
              ;;
            stablecoin_runtime_status)
              remote_command="$(cat <<'REMOTE'
          set -u
          frontend='/var/www/vhosts/chainsolutions.fr/stablecoin.chainsolutions.fr/stablecoin'
          backend='/var/www/vhosts/chainsolutions.fr/api.stablecoin.chainsolutions.fr'
          if [ -d "$frontend" ]; then frontend_exists=true; else frontend_exists=false; fi
          if [ -d "$backend" ]; then backend_exists=true; else backend_exists=false; fi
          printf 'frontend_path_exists=%s\n' "$frontend_exists"
          printf 'backend_path_exists=%s\n' "$backend_exists"
          printf 'processes_begin\n'
          if command -v pgrep >/dev/null 2>&1; then
            pids="$(pgrep -f 'Passenger|passenger|node' 2>/dev/null || true)"
            count='0'
            for pid in $pids; do
              [ "$pid" = "$$" ] && continue
              comm="$(cat "/proc/$pid/comm" 2>/dev/null || true)"
              cwd="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"
              case "$comm:$cwd" in
                *Passenger*|*passenger*|*stablecoin*)
                  printf 'pid=%s comm=%s cwd=%s\n' "$pid" "$(printf '%s' "$comm" | tr '[:space:]' '_')" "$cwd"
                  count=$((count + 1))
                  [ "$count" -ge 80 ] && break
                  ;;
              esac
            done
          else
            printf 'process_probe=UNAVAILABLE\n'
          fi
          printf 'processes_end\n'
          for url in 'https://stablecoin.chainsolutions.fr/' 'https://api.stablecoin.chainsolutions.fr/' 'https://api.stablecoin.chainsolutions.fr/health'; do
            if command -v curl >/dev/null 2>&1; then
              code="$(curl --silent --location --max-time 10 --output /dev/null --write-out '%{http_code}' "$url" 2>/dev/null || true)"
              [ -n "$code" ] || code='000'
            else
              code='UNAVAILABLE'
            fi
            printf 'http_status=%s %s\n' "$code" "$url"
          done
          exit 0
          REMOTE
          )"
              ;;
            server_disk)
              remote_command="set -euo pipefail; df -h /"
              ;;
            docker_status)
              remote_command="set -euo pipefail; docker ps --format 'table {{.Names}}\\t{{.Status}}\\t{{.Ports}}'"
              ;;
            *)
              exit 33
              ;;
          esac

          ssh -F /dev/null \
            -i "$ssh_dir/key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=10 \
            "$SSH_USER@$SSH_HOST" "$remote_command" \
            > "$evidence_dir/output.txt"

          TARGET="$TARGET" PROBE="$PROBE" REQUEST_ID="$REQUEST_ID" \
          RUN_ID="$GITHUB_RUN_ID" REPOSITORY="$GITHUB_REPOSITORY" SHA="$GITHUB_SHA" \
          node <<'NODE' > "$evidence_dir/metadata.json"
          const fs = require('fs');
          const crypto = require('crypto');
          const path = process.env.RUNNER_TEMP + '/mcp-readonly-evidence/output.txt';
          const output = fs.readFileSync(path);
          process.stdout.write(JSON.stringify({
            schemaVersion: 1,
            policy: 'github-readonly-evidence-v1',
            transport: 'github_actions_ssh_readonly',
            requestId: process.env.REQUEST_ID,
            target: process.env.TARGET,
            probe: process.env.PROBE,
            repository: process.env.REPOSITORY,
            workflowSha: process.env.SHA,
            workflowRunId: Number(process.env.RUN_ID),
            observedAt: new Date().toISOString(),
            outputSha256: crypto.createHash('sha256').update(output).digest('hex'),
            mutationAllowed: false
          }, null, 2) + '\n');
          NODE

          printf 'artifact_name=mcp-readonly-evidence-%s\n' "$REQUEST_ID" >> "$GITHUB_OUTPUT"

      - name: Upload SSH fallback evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.artifact_name }}
          path: ${{ runner.temp }}/mcp-readonly-evidence
          if-no-files-found: error
          retention-days: 1

      - name: Report SSH fallback evidence handle to GitHub issue
        if: github.event_name == 'issues' && success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.authorize.outputs.issue_number }}
          REQUEST_ID: ${{ needs.authorize.outputs.request_id }}
          TARGET: ${{ needs.authorize.outputs.target }}
          PROBE: ${{ needs.authorize.outputs.probe }}
          ARTIFACT_NAME: ${{ steps.collect.outputs.artifact_name }}
        run: |
          set -euo pipefail
          body="$(node -e "process.stdout.write(JSON.stringify({body:[
            'MCP_READONLY_EVIDENCE_RESULT',
            'requestId=' + process.env.REQUEST_ID,
            'target=' + process.env.TARGET,
            'probe=' + process.env.PROBE,
            'runId=' + process.env.GITHUB_RUN_ID,
            'artifact=' + process.env.ARTIFACT_NAME,
            'transport=github_actions_ssh_readonly',
            'status=SUCCESS',
            'mutationAllowed=false'
          ].join('\\n')}))")"
          curl --fail --silent --show-error --max-time 10 \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$body" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            >/dev/null

      - name: Report unavailable SSH fallback
        if: github.event_name == 'issues' && failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.authorize.outputs.issue_number }}
          REQUEST_ID: ${{ needs.authorize.outputs.request_id }}
        run: |
          set -euo pipefail
          body="$(node -e "process.stdout.write(JSON.stringify({body:[
            'MCP_READONLY_EVIDENCE_RESULT',
            'requestId=' + process.env.REQUEST_ID,
            'runId=' + process.env.GITHUB_RUN_ID,
            'status=BLOCKED',
            'reason=oidc_endpoint_failed_and_ssh_fallback_unavailable',
            'mutationAllowed=false'
          ].join('\\n')}))")"
          curl --fail --silent --show-error --max-time 10 \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$body" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            >/dev/null
