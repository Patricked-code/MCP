name: Governed Repository SSH CA Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bootstrap governed repository SSH CA through MCP
        shell: bash
        env:
          MCP_BASE_URL: https://mcp.wealthtechinnovations.com
          MCP_OIDC_AUDIENCE: https://mcp.wealthtechinnovations.com/access/github/repository-ssh/ca/bootstrap
        run: |
          set -euo pipefail

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            printf '%s\n' 'GitHub OIDC request context unavailable.' >&2
            exit 1
          fi

          separator='?'
          case "$ACTIONS_ID_TOKEN_REQUEST_URL" in
            *\?*) separator='&' ;;
          esac

          OIDC_RESPONSE="$(curl --fail --silent --show-error --max-time 10 \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=https%3A%2F%2Fmcp.wealthtechinnovations.com%2Faccess%2Fgithub%2Frepository-ssh%2Fca%2Fbootstrap")"

          OIDC_TOKEN="$(printf '%s' "$OIDC_RESPONSE" | node -e "const fs=require('fs'); const raw=fs.readFileSync(0,'utf8'); if(Buffer.byteLength(raw)>32768)process.exit(1); const body=JSON.parse(raw); if(!body||typeof body.value!=='string'||body.value.length<32||body.value.length>16384)process.exit(1); process.stdout.write(body.value);")"
          unset OIDC_RESPONSE
          printf '::add-mask::%s\n' "$OIDC_TOKEN"

          BODY="$(GITHUB_SHA="$GITHUB_SHA" node -e "const s=process.env.GITHUB_SHA; if(!/^[0-9a-f]{40}$/.test(s))process.exit(1); process.stdout.write(JSON.stringify({sha:s}));")"

          RESPONSE="$(curl --fail --silent --show-error --max-time 30 \
            --request POST \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "$BODY" \
            "${MCP_BASE_URL}/access/github/repository-ssh/ca/bootstrap")"
          unset OIDC_TOKEN BODY

          printf '%s' "$RESPONSE" | GITHUB_SHA="$GITHUB_SHA" node -e "const fs=require('fs'); const raw=fs.readFileSync(0,'utf8'); if(Buffer.byteLength(raw)>8192)process.exit(1); const body=JSON.parse(raw); if(body?.status!=='READY'||body?.requestedSha!==process.env.GITHUB_SHA||body?.mutationScope!=='SSH_CA_BOOTSTRAP_ONLY'||typeof body?.caFingerprint!=='string'||!body.caFingerprint.startsWith('SHA256:'))process.exit(1); process.stdout.write('Governed repository SSH CA READY: '+body.caFingerprint+'\n');"
