name: PR36 Lockfile Refresh

on:
  push:
    branches:
      - security/fix-hono-node-server-20260806

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security/fix-hono-node-server-20260806
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Refresh only package-lock
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const v = lock.packages?.['node_modules/@hono/node-server']?.version;
          if (v !== '2.0.12') {
            throw new Error(`Unexpected @hono/node-server version: ${v}`);
          }
          NODE

      - name: Commit lockfile and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/pr36-lock-refresh.yml
          git diff --cached --check
          git commit -m "fix(security): refresh Hono node server lockfile"
          git push origin HEAD:security/fix-hono-node-server-20260806
