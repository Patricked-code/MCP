name: MCP CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'mcp/**'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare autodeploy governance candidates
        run: node scripts/generate-autodeploy-governance-candidates.mjs

      - name: Upload autodeploy governance candidates
        uses: actions/upload-artifact@v4
        with:
          name: mcp-autodeploy-governance
          path: /tmp/mcp-autodeploy-governance
          if-no-files-found: error
          retention-days: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Generate function cartography candidate
        run: |
          node --import tsx scripts/emit-function-cartography.ts > /tmp/function-cartography.json
          node -e "const fs=require('fs'); const p='/tmp/function-cartography.json'; fs.writeFileSync(p, JSON.stringify(JSON.parse(fs.readFileSync(p,'utf8')), null, 2)+'\n')"

      - name: Upload function cartography candidate
        uses: actions/upload-artifact@v4
        with:
          name: mcp-function-cartography-candidate
          path: /tmp/function-cartography.json
          if-no-files-found: error
          retention-days: 1

      - name: Commit exact B2 function cartography candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/mcp/b2-repository-resolution-20260909'
        shell: bash
        run: |
          expected='b26dae1b36c889f0920b3a6843e5f6994cc5478e1bfd7fda7511fcb63dd98385'
          actual="$(node -e "const fs=require('fs'); console.log(JSON.parse(fs.readFileSync('/tmp/function-cartography.json','utf8')).catalogueDigest)")"
          test "$actual" = "$expected"
          cp /tmp/function-cartography.json .mcp/function-cartography.json
          if git diff --quiet -- .mcp/function-cartography.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .mcp/function-cartography.json
          git commit -m 'docs: regenerate B2 function cartography'
          git push origin HEAD:mcp/b2-repository-resolution-20260909

      - name: Docs check
        run: npm run docs:check

      - name: Governance tests
        run: npm run test:governance

      - name: Secret scan
        run: npm run lint:secrets --if-present

      - name: Read-only safety tests
        run: npm run test:readonly-safety

      - name: Whitespace diff check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          elif [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            git show --check --format=fuller "${{ github.sha }}"
          else
            git diff --check "${{ github.event.before }}...${{ github.sha }}"
          fi