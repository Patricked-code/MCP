name: MCP CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'mcp/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare autodeploy governance candidates
        run: node scripts/generate-autodeploy-governance-candidates.mjs

      - name: Upload autodeploy governance candidates
        uses: actions/upload-artifact@v4
        with:
          name: mcp-autodeploy-governance
          path: /tmp/mcp-autodeploy-governance
          if-no-files-found: error
          retention-days: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Auto-intake discovery safety tests
        run: node --test tests/mcpAutoIntakeDiscovery.test.mjs

      - name: Governed task queue targeted claim tests
        run: npx tsx --test tests/governedTaskQueue.test.ts

      - name: Plesk provisioning RED-GREEN safety tests
        run: npx tsx --test tests/pleskSiteProvisioning.test.ts tests/pleskSiteExecution.test.ts tests/pleskSshAdapter.test.ts tests/pleskToolPolicy.test.ts tests/pleskWebConsent.test.ts

      - name: Existing GitHub App installation tokens RED-GREEN
        run: npx tsx --test tests/githubAppInstallationToken.test.ts

      - name: GRT S1 governed pilot RED-GREEN tests
        run: npx tsx --test tests/governPilot.test.ts tests/governPilotRoutes.test.ts

      - name: GRT source GitHub App optional RED-GREEN tests
        run: npx tsx --test tests/governPilotArchiveSource.test.ts

      - name: OAuth consent and PKCE regression tests
        run: npx tsx --test tests/oauthAuthorizeConsent.test.ts

      - name: UTL V03 T_IN–T_OUT TypeScript contract safety tests
        run: npx tsx --test tests/utlCircuitTrace.test.ts

      - name: Docs check
        run: npm run docs:check

      - name: UTL reconciliation offline evidence and non-regression tests
        run: python3 -m unittest discover -s tests -p 'test_utl_reconciliation.py' -v

      - name: Build UTL reconciliation SQLite evidence artifact
        run: python3 scripts/build_utl_reconciliation.py --out /tmp/mcp-utl-reconciliation.sqlite --report /tmp/mcp-utl-reconciliation-report.json

      - name: UTL v03 circuit and non-regression tests
        run: python3 -m unittest discover -s tests -p 'test_utl_circuit_matrix_v03.py' -v

      - name: Enrich existing UTL SQLite with v03 causal circuit contracts
        run: python3 scripts/enrich_utl_circuit_matrix.py --db /tmp/mcp-utl-reconciliation.sqlite --report /tmp/mcp-utl-circuit-matrix-v03-report.json

      - name: UTL v03 workflow server attestation integrity tests
        run: python3 -m unittest discover -s tests -p 'test_utl_workflow_evidence_v03.py' -v

      - name: Attach historical exact-SHA S1 workflow receipts
        run: python3 scripts/attach_utl_workflow_evidence_v03.py --db /tmp/mcp-utl-reconciliation.sqlite --report /tmp/mcp-utl-workflow-evidence-v03-report.json

      - name: UTL v03 five additional workflow receipt tests
        run: python3 -m unittest discover -s tests -p 'test_utl_workflow_evidence_v03_p02.py' -v

      - name: Extend seven historical exact-SHA S1 workflow receipts
        run: python3 scripts/append_utl_workflow_evidence_v03.py --db /tmp/mcp-utl-reconciliation.sqlite --report /tmp/mcp-utl-workflow-evidence-v03-p02-report.json

      - name: PR372 deployment event register non-regression tests
        run: python3 -m unittest discover -s tests -p 'test_utl_deploy_event_registry.py' -v

      - name: Build offline deployment evidence SQLite and quality report
        run: python3 scripts/build_utl_deploy_event_registry.py --out /tmp/mcp-deployment-evidence.sqlite --report /tmp/mcp-deployment-evidence-report.json

      - name: Upload UTL reconciliation evidence
        uses: actions/upload-artifact@v4
        with:
          name: mcp-utl-reconciliation
          path: |
            /tmp/mcp-utl-reconciliation.sqlite
            /tmp/mcp-utl-reconciliation-report.json
            /tmp/mcp-utl-circuit-matrix-v03-report.json
            /tmp/mcp-utl-workflow-evidence-v03-report.json
            /tmp/mcp-utl-workflow-evidence-v03-p02-report.json
            /tmp/mcp-deployment-evidence.sqlite
            /tmp/mcp-deployment-evidence-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Governance tests
        run: npm run test:governance

      - name: GWC dossier check
        run: npm run gwc:verify

      - name: Secret scan
        run: npm run lint:secrets --if-present

      - name: Read-only safety tests
        run: npm run test:readonly-safety

      - name: Whitespace diff check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          elif [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            git show --check --format=fuller "${{ github.sha }}"
          else
            git diff --check "${{ github.event.before }}...${{ github.sha }}"
          fi
