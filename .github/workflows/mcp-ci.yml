name: MCP CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'mcp/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare autodeploy governance candidates
        run: node scripts/generate-autodeploy-governance-candidates.mjs

      - name: Upload autodeploy governance candidates
        uses: actions/upload-artifact@v4
        with:
          name: mcp-autodeploy-governance
          path: /tmp/mcp-autodeploy-governance
          if-no-files-found: error
          retention-days: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Auto-intake discovery safety tests
        run: node --test tests/mcpAutoIntakeDiscovery.test.mjs

      - name: Governed task queue targeted claim tests
        run: npx tsx --test tests/governedTaskQueue.test.ts

      - name: Plesk provisioning RED-GREEN safety tests
        run: npx tsx --test tests/pleskSiteProvisioning.test.ts tests/pleskSiteExecution.test.ts tests/pleskSshAdapter.test.ts tests/pleskToolPolicy.test.ts tests/pleskWebConsent.test.ts

      - name: Existing GitHub App installation tokens RED-GREEN
        run: npx tsx --test tests/githubAppInstallationToken.test.ts

      - name: GRT S1 governed pilot RED-GREEN tests
        run: npx tsx --test tests/governPilot.test.ts tests/governPilotRoutes.test.ts

      - name: GRT source GitHub App optional RED-GREEN tests
        run: npx tsx --test tests/governPilotArchiveSource.test.ts

      - name: GRT pilot governed runtime authority RED-GREEN
        run: npx tsx --test tests/governPilotAdmission.test.ts

      - name: OAuth consent and PKCE regression tests
        run: npx tsx --test tests/oauthAuthorizeConsent.test.ts

      - name: Docs check
        run: npm run docs:check

      - name: Governance tests
        run: npm run test:governance

      - name: GWC dossier check
        run: npm run gwc:verify

      - name: Secret scan
        run: npm run lint:secrets --if-present

      - name: Read-only safety tests
        run: npm run test:readonly-safety

      - name: Whitespace diff check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          elif [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            git show --check --format=fuller "${{ github.sha }}"
          else
            git diff --check "${{ github.event.before }}...${{ github.sha }}"
          fi
