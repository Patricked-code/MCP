name: MCP Governed Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      g1-evidence: ${{ steps.deploy.outputs.g1-evidence }}
    steps:
      - name: Checkout governed policy
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve deployment gate
        id: gate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          enabled=false
          admission_kind=''
          ci_run_id=''
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            enabled=true
            admission_kind=workflow_dispatch_manual
          else
            push_enabled="$(node -e "const p=require('./.mcp/autodeploy-policy.json'); if (p.schemaVersion !== 1 || typeof p.pushEnabled !== 'boolean') process.exit(2); process.stdout.write(p.pushEnabled ? 'true' : 'false');")"

            if [ "$push_enabled" = "true" ]; then
              for attempt in $(seq 1 60); do
                runs_json=''
                if ! runs_json="$(curl --fail --silent --show-error --max-time 10 \
                  --header "Accept: application/vnd.github+json" \
                  --header "Authorization: Bearer ${GITHUB_TOKEN}" \
                  --header "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/mcp-ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=20")"; then
                  sleep 10
                  continue
                fi

                ci_state="$(GITHUB_SHA="$GITHUB_SHA" node -e "const fs=require('fs'); const raw=fs.readFileSync(0,'utf8'); if (Buffer.byteLength(raw,'utf8') > 1048576) process.exit(1); let body; try { body=JSON.parse(raw); } catch { process.exit(1); } if (!body || !Array.isArray(body.workflow_runs)) process.exit(1); const sha=process.env.GITHUB_SHA; const runs=body.workflow_runs.filter((run) => run && run.head_sha === sha && run.event === 'push' && run.name === 'MCP CI'); if (runs.length === 0) { process.stdout.write('pending'); } else { const run=runs[0]; if (run.status !== 'completed') process.stdout.write('pending'); else if (run.conclusion === 'success' && Number.isSafeInteger(run.id) && run.id > 0) process.stdout.write('success:'+String(run.id)); else process.stdout.write('failed'); }" <<<"$runs_json")"

                case "$ci_state" in
                  success:*)
                    enabled=true
                    admission_kind=push_ci_gate
                    ci_run_id="${ci_state#success:}"
                    break
                    ;;
                  failed)
                    enabled=false
                    break
                    ;;
                  pending)
                    sleep 10
                    ;;
                  *)
                    enabled=false
                    break
                    ;;
                esac
              done
            fi
          fi

          printf 'enabled=%s\n' "$enabled" >> "$GITHUB_OUTPUT"
          printf 'admission_kind=%s\n' "$admission_kind" >> "$GITHUB_OUTPUT"
          printf 'ci_run_id=%s\n' "$ci_run_id" >> "$GITHUB_OUTPUT"

      - name: Deploy exact main SHA through MCP
        id: deploy
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        env:
          MCP_BASE_URL: https://mcp.wealthtechinnovations.com
          MCP_OIDC_AUDIENCE: https://mcp.wealthtechinnovations.com/deploy/github/s1
          DEPLOY_ADMISSION_KIND: ${{ steps.gate.outputs.admission_kind }}
          DEPLOY_CI_RUN_ID: ${{ steps.gate.outputs.ci_run_id }}
        run: |
          set -euo pipefail

          get_oidc() {
            if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
              printf '%s\n' 'GitHub OIDC request context unavailable.' >&2
              return 1
            fi

            local separator='?'
            case "$ACTIONS_ID_TOKEN_REQUEST_URL" in
              *\?*) separator='&' ;;
            esac

            local response
            response="$(curl --fail --silent --show-error --max-time 10 \
              --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=https%3A%2F%2Fmcp.wealthtechinnovations.com%2Fdeploy%2Fgithub%2Fs1")"

            printf '%s' "$response" | node -e "const fs=require('fs'); const raw=fs.readFileSync(0,'utf8'); if (Buffer.byteLength(raw,'utf8') > 32768) process.exit(1); let body; try { body=JSON.parse(raw); } catch { process.exit(1); } if (!body || typeof body.value !== 'string' || body.value.length < 32 || body.value.length > 16384) process.exit(1); process.stdout.write(body.value);"
          }

          build_start_body() {
            GITHUB_SHA="$GITHUB_SHA" DEPLOY_ADMISSION_KIND="$DEPLOY_ADMISSION_KIND" DEPLOY_CI_RUN_ID="$DEPLOY_CI_RUN_ID" node -e "const sha=process.env.GITHUB_SHA; const kind=process.env.DEPLOY_ADMISSION_KIND; if (!/^[0-9a-f]{40}$/.test(sha)) process.exit(1); if (kind === 'workflow_dispatch_manual') { process.stdout.write(JSON.stringify({sha})); } else if (kind === 'push_ci_gate') { const ciRunId=Number(process.env.DEPLOY_CI_RUN_ID); if (!Number.isSafeInteger(ciRunId) || ciRunId <= 0) process.exit(1); process.stdout.write(JSON.stringify({sha,admission:{kind:'push_ci_gate',ciRunId,ciHeadSha:sha,ciConclusion:'success'}})); } else { process.exit(1); }"
          }

          validate_start() {
            GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" node -e "const fs=require('fs'); const raw=fs.readFileSync(0,'utf8'); if (Buffer.byteLength(raw,'utf8') > 16384) process.exit(1); let body; try { body=JSON.parse(raw); } catch { process.exit(1); } const sha=process.env.GITHUB_SHA; const expected='mcp-s1-'+process.env.GITHUB_RUN_ID+'-'+sha.slice(0, 12); if (!body || body.jobId !== expected || body.requestedSha !== sha || body.status !== 'queued') process.exit(1); process.stdout.write(body.jobId);"
          }

          validate_status() {
            GITHUB_SHA="$GITHUB_SHA" JOB_ID="$JOB_ID" node -e "const fs=require('fs'); const raw=fs.readFileSync(0,'utf8'); if (Buffer.byteLength(raw,'utf8') > 16384) process.exit(1); let body; try { body=JSON.parse(raw); } catch { process.exit(1); } const sha=process.env.GITHUB_SHA; const job=process.env.JOB_ID; if (!body || body.jobId !== job || body.requestedSha !== sha) process.exit(1); if (body.status === 'succeeded') { if (body.phase !== 'attested' || body.runtimeRevision !== sha || body.rollbackStatus !== 'not_needed' || body.healthOk !== true || body.oauthOk !== true || body.mcpAuthOk !== true) process.exit(1); process.stdout.write('succeeded'); } else if (body.status === 'failed') { process.stdout.write('failed'); } else if (body.status === 'queued' || body.status === 'running') { process.stdout.write(body.status); } else { process.exit(1); }"
          }

          OIDC_TOKEN="$(get_oidc)"
          printf '::add-mask::%s\n' "$OIDC_TOKEN"
          START_BODY="$(build_start_body)"
          START_RESPONSE="$(curl --fail --silent --show-error --max-time 10 \
            --request POST \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "$START_BODY" \
            "${MCP_BASE_URL}/deploy/github/s1/start")"
          JOB_ID="$(printf '%s' "$START_RESPONSE" | validate_start)"
          printf 'Deployment job accepted: %s for %s\n' "$JOB_ID" "$GITHUB_SHA"
          unset OIDC_TOKEN START_BODY START_RESPONSE

          for attempt in $(seq 1 60); do
            OIDC_TOKEN="$(get_oidc)"
            printf '::add-mask::%s\n' "$OIDC_TOKEN"
            STATUS_RESPONSE=''
            if ! STATUS_RESPONSE="$(curl --fail --silent --show-error --max-time 10 \
              --header "Authorization: Bearer ${OIDC_TOKEN}" \
              "${MCP_BASE_URL}/deploy/github/s1/status/${JOB_ID}?sha=${GITHUB_SHA}")"; then
              unset OIDC_TOKEN STATUS_RESPONSE
              sleep 10
              continue
            fi
            unset OIDC_TOKEN

            STATE="$(printf '%s' "$STATUS_RESPONSE" | validate_status)"
            case "$STATE" in
              succeeded)
                printf 'Deployment attested for exact SHA %s.\n' "$GITHUB_SHA"
                unset STATUS_RESPONSE
                if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
                  # Preserve successful deployment separately from documentary evidence collection.
                  G1_EVIDENCE='{"status":"UNVERIFIED","reasonCodes":["G1_POST_DEPLOY_PROOF_PENDING"]}'
                  # HTTP health can pass before the Docker health status becomes healthy.
                  # Retry only the read-only proof, within a single bounded window.
                  G1_DEADLINE=$((SECONDS + 180))
                  for g1_attempt in $(seq 1 16); do
                    G1_REMAINING=$((G1_DEADLINE - SECONDS))
                    if (( G1_REMAINING <= 10 )); then break; fi
                    if OIDC_TOKEN="$(get_oidc)"; then
                      printf '::add-mask::%s\n' "$OIDC_TOKEN"
                      if G1_STATUS="$(curl --fail --silent --show-error --max-time "$((G1_REMAINING - 10))" \
                        --header "Authorization: Bearer ${OIDC_TOKEN}" \
                        "${MCP_BASE_URL}/deploy/github/s1/status/${JOB_ID}?sha=${GITHUB_SHA}&g1=1")"; then
                        if [[ "$(printf '%s' "$G1_STATUS" | validate_status)" == 'succeeded' ]] &&
                          G1_CANDIDATE="$(node -e 'const {g1}=JSON.parse(require("fs").readFileSync(0,"utf8")); if (!["ALIGNED","DRIFT","UNVERIFIED"].includes(g1?.status)) process.exit(1); if (g1.status==="UNVERIFIED" && g1.reasonCodes!==undefined && (!Array.isArray(g1.reasonCodes) || g1.reasonCodes.length>20 || !g1.reasonCodes.every(x=>typeof x==="string" && /^G1_[A-Z0-9_]{2,80}$/.test(x)))) process.exit(1); process.stdout.write(JSON.stringify(g1));' <<<"$G1_STATUS")"; then
                          G1_EVIDENCE="$G1_CANDIDATE"
                          # An UNVERIFIED observation is evidence of a BLOCK, not completion.
                          if [[ "$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).status)' "$G1_CANDIDATE")" != "UNVERIFIED" ]]; then
                            break
                          fi
                        fi
                      fi
                    fi
                    if [[ "$g1_attempt" != 16 ]] && (( SECONDS + 10 < G1_DEADLINE )); then sleep 10; fi
                  done
                  printf 'g1-evidence=%s\n' "$G1_EVIDENCE" >> "$GITHUB_OUTPUT"
                  unset OIDC_TOKEN G1_EVIDENCE G1_STATUS G1_CANDIDATE
                fi
                exit 0
                ;;
              failed)
                printf 'Governed deployment failed for %s.\n' "$GITHUB_SHA" >&2
                exit 1
                ;;
              queued|running)
                sleep 10
                ;;
              *)
                exit 1
                ;;
            esac
          done

          printf 'Deployment status polling timed out for %s.\n' "$GITHUB_SHA" >&2
          exit 1

  reconcile-documentation:
    needs: deploy
    if: github.repository == 'Patricked-code/MCP' && github.ref == 'refs/heads/main' && needs.deploy.outputs.g1-evidence != ''
    runs-on: ubuntu-latest
    timeout-minutes: 6
    # A documentary failure must not suppress existing successful-deploy observers.
    continue-on-error: true
    permissions:
      contents: read
    concurrency:
      group: mcp-g1-documentation
      cancel-in-progress: false
    steps:
      - name: Classify released evidence
        id: g1
        env:
          G1_EVIDENCE: ${{ needs.deploy.outputs.g1-evidence }}
        run: |
          node -e 'const fs=require("fs"); const {status,reasonCodes}=JSON.parse(process.env.G1_EVIDENCE); if (!["DRIFT","ALIGNED"].includes(status)) {const codes=Array.isArray(reasonCodes)?reasonCodes.filter(x=>typeof x==="string" && /^G1_[A-Z0-9_]{2,80}$/.test(x)).slice(0,20):[]; fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"### G1 proof blocked — UNVERIFIED\nNo GitHub write performed. Bounded reasons: "+(codes.join(", ")||"G1_CAUSE_UNAVAILABLE")+"\n"); throw Error("G1 proof unavailable; no GitHub write attempted");} fs.appendFileSync(process.env.GITHUB_OUTPUT,"drift="+(status==="DRIFT")+"\n");'
      - uses: actions/checkout@v4
        if: steps.g1.outputs.drift == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.g1.outputs.drift == 'true'
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
        if: steps.g1.outputs.drift == 'true'
      - name: Mint repository-scoped documentation token
        id: g1-token
        if: steps.g1.outputs.drift == 'true'
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ vars.MCP_G1_APP_ID }}
          private-key: ${{ secrets.MCP_G1_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Publish or reuse exact-SHA docs-only draft
        if: steps.g1.outputs.drift == 'true'
        env:
          G1_EVIDENCE: ${{ needs.deploy.outputs.g1-evidence }}
          G1_GITHUB_TOKEN: ${{ steps.g1-token.outputs.token }}
        run: |
          set -euo pipefail
          evidence_file="$RUNNER_TEMP/mcp-g1-evidence.json"
          printf '%s' "$G1_EVIDENCE" > "$evidence_file"
          G1_EVIDENCE_FILE="$evidence_file" node --import tsx scripts/mcp-g1-documentation.ts

      - name: Record blocked documentary follow-up
        if: failure()
        run: |
          printf '%s\n' '### G1 documentation follow-up blocked' 'No merge was attempted. Inspect the failed G1 step before retrying. The deployment attestation is independent.' >> "$GITHUB_STEP_SUMMARY"

  # REC-00/01: a mandatory observation on each attested deployment.
  # Keep legacy technical-success observers operational; the report's explicit
  # closure verdict, not this workflow's success, is the documentary evidence.
  documentary-closure:
    needs: deploy
    if: github.repository == 'Patricked-code/MCP' && github.ref == 'refs/heads/main' && needs.deploy.outputs.g1-evidence != ''
    runs-on: ubuntu-latest
    timeout-minutes: 6
    continue-on-error: true
    permissions:
      contents: read
    outputs:
      closure-status: ${{ steps.closure.outputs.closure-status }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Observe documentary coverage and exact Git differences
        id: closure
        env:
          G1_EVIDENCE: ${{ needs.deploy.outputs.g1-evidence }}
          DOCUMENTARY_REPORT_FILE: ${{ runner.temp }}/mcp-documentary-closure.json
        run: node scripts/mcp-documentary-closure.mjs
      - name: Retain documentary closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentary-closure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mcp-documentary-closure.json
          if-no-files-found: error
          retention-days: 90
      - name: Record unavailable evidence
        if: failure()
        run: |
          printf '%s\n' '### Documentary closure: DOCUMENTARY_CLOSURE_BLOCKED' 'No complete report was retained. Global closure is not attested; reobserve.' >> "$GITHUB_STEP_SUMMARY"
