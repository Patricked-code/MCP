name: Repository creation capsule CI
on:
  pull_request:
    paths:
      - 'capsules/grt-repository-creation/**'
      - '.github/workflows/repository-creation-capsule-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capsule-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: capsules/grt-repository-creation
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test GRT read-only contract and architecture evidence
        run: node --test test/*.test.mjs
